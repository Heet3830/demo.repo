<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Shooter</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020205; 
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.3s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .neon-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 5px #0ff, 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #00aaff;
            margin-bottom: 25px;
            letter-spacing: 4px;
            line-height: 1.1;
        }

        .neon-text {
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5), 0 0 10px #0ff;
        }

        p {
            font-size: 1rem;
            margin-bottom: 12px;
            line-height: 1.6;
            color: #ccc;
        }

        /* Difficulty Selector */
        .difficulty-selector {
            margin: 25px 0;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        #diffButtons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .diff-btn {
            padding: 10px 16px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #444;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .diff-btn:hover {
            border-color: #0ff;
            color: #fff;
        }

        .diff-btn.active {
            border-color: #ff003c;
            color: #fff;
            background: rgba(255, 0, 60, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4) inset, 0 0 15px rgba(255, 0, 60, 0.4);
            text-shadow: 0 0 5px #ff003c;
        }

        /* Upgraded Buttons */
        .neon-btn {
            margin-top: 15px;
            padding: 15px 45px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #0ff;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.05), transparent);
            border: 2px solid #0ff;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3) inset, 0 0 15px rgba(0, 255, 255, 0.3);
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .neon-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 0 20px #0ff inset, 0 0 30px #0ff;
            transform: translateY(-2px);
        }
        
        .neon-btn:active {
            transform: translateY(1px);
        }

        .neon-btn.small {
            padding: 8px 20px;
            font-size: 1rem;
            margin: 0;
            border-width: 1px;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.3) inset, 0 0 15px rgba(0, 255, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.5) inset, 0 0 30px rgba(0, 255, 255, 0.6); }
            100% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.3) inset, 0 0 15px rgba(0, 255, 255, 0.3); }
        }
        #startBtn {
            animation: pulseGlow 2s infinite;
        }

        /* Leaderboard List */
        #leaderboardList {
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
            font-size: 1.5rem;
            line-height: 2;
            color: #fff;
            text-shadow: 0 0 5px #0f0, 0 0 15px #0f0;
            width: 80%;
            max-width: 300px;
        }
        
        #leaderboardList li {
            border-bottom: 1px solid rgba(0, 255, 0, 0.3);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            background: rgba(0, 255, 0, 0.05);
            margin-bottom: 5px;
            border-radius: 4px;
        }

        /* Glass HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            padding: 15px;
            pointer-events: none;
            z-index: 50;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .score-container p, .level-container p {
            margin: 0 0 5px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        .health-container {
            width: 130px;
            margin-top: 5px;
        }

        .health-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5) inset;
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff003c, #ff6a00);
            box-shadow: 0 0 10px #ff003c;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #powerupIndicators {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .powerup-text {
            font-size: 0.75rem;
            font-weight: bold;
            text-shadow: 0 0 5px currentColor;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            border-left: 2px solid currentColor;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            display: none;
        }

        .touch-btn {
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
        }

        .touch-btn:active {
            background: rgba(0, 255, 255, 0.3);
            transform: scale(0.95);
        }

        .shoot-btn {
            width: 75px;
            height: 75px;
            border-color: rgba(255, 0, 255, 0.4);
            background: rgba(255, 0, 255, 0.05);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .shoot-btn:active {
            background: rgba(255, 0, 255, 0.3);
        }

        @media (max-width: 768px), (pointer: coarse) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Glass HUD -->
        <div id="hud">
            <div class="hud-top">
                <div class="score-container">
                    <p>Score: <span id="scoreDisplay" class="neon-text">0</span></p>
                    <p>Top: <span id="highScoreDisplay" class="neon-text">0</span></p>
                </div>
                <div class="health-container">
                    <p style="margin: 0 0 3px 0; font-size: 0.7rem; color: #ff003c; text-shadow: 0 0 5px #ff003c;">HULL INTEGRITY</p>
                    <div class="health-bar-bg">
                        <div id="healthBar" class="health-bar-fill"></div>
                    </div>
                </div>
                <div class="level-container" style="text-align: right;">
                    <p>Lvl <span id="levelDisplay" class="neon-text" style="font-size:1.2rem;">1</span></p>
                    <button id="pauseBtn" class="neon-btn small" style="padding: 4px 10px; margin-top:5px;">||</button>
                </div>
            </div>
            <div id="powerupIndicators"></div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="overlay">
            <h1 class="neon-title">NEON<br>SHOOTER</h1>
            <button id="openLeaderboardBtn" class="neon-btn small" style="margin-bottom: 20px;">LEADERBOARD</button>
            <p><strong>Move:</strong> ◄ ► or A / D<br><strong>Shoot:</strong> Space</p>
            <p style="font-size:0.85rem; margin-top: 10px;">
                <span style="color:#0f0">■ Weapon</span> &nbsp; 
                <span style="color:#0ff">■ Shield</span> &nbsp; 
                <span style="color:#ff003c">■ Repair</span>
            </p>
            
            <div class="difficulty-selector">
                <div id="diffButtons">
                    <button class="diff-btn" data-diff="0.7">EASY</button>
                    <button class="diff-btn active" data-diff="1.0">NORMAL</button>
                    <button class="diff-btn" data-diff="1.3">HARD</button>
                </div>
            </div>

            <button id="startBtn" class="neon-btn">INITIALIZE</button>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboardScreen" class="overlay hidden">
            <h1 class="neon-title" style="color: #0f0; text-shadow: 0 0 10px #0f0; font-size: 2.5rem;">HALL OF FAME</h1>
            <ul id="leaderboardList">
                <!-- Scores injected by JS -->
            </ul>
            <button id="closeLeaderboardBtn" class="neon-btn">RETURN</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1 class="neon-title" style="color: #ff003c; text-shadow: 0 0 10px #ff003c, 0 0 40px #ff0000; font-size: 3.5rem;">CRITICAL<br>FAILURE</h1>
            <p style="font-size: 1.2rem;">Final Score: <span id="finalScore" class="neon-text" style="font-size: 1.5rem;">0</span></p>
            <button id="restartBtn" class="neon-btn">REDEPLOY</button>
        </div>

        <!-- Pause Screen -->
        <div id="pauseScreen" class="overlay hidden">
            <h1 class="neon-title" style="color: #ffff00; font-size: 3rem;">SYSTEM<br>PAUSED</h1>
            <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <button id="resumeBtn" class="neon-btn">RESUME</button>
                <button id="homeBtn" class="neon-btn">MAIN MENU</button>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="mobile-controls">
            <button id="btnLeft" class="touch-btn">◄</button>
            <button id="btnShoot" class="touch-btn shoot-btn">◎</button>
            <button id="btnRight" class="touch-btn">►</button>
        </div>
    </div>

    <script>
        /**
         * NEON SPACE SHOOTER
         * Dynamic Parallax Planets + Audio Update
         */

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        const Sound = {
            playTone: (freq, type, duration, vol=0.1) => {
                if(audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            
            hover: () => {
                if(audioCtx.state !== 'running') return; 
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            },
            
            shoot: () => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            },
            
            rockBreak: () => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 600; 
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start();

                const osc = audioCtx.createOscillator();
                const thumpGain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                thumpGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                thumpGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(thumpGain);
                thumpGain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            },
            
            powerup: () => {
                Sound.playTone(400, 'sine', 0.1, 0.1);
                setTimeout(() => Sound.playTone(600, 'sine', 0.1, 0.1), 100);
                setTimeout(() => Sound.playTone(800, 'sine', 0.2, 0.1), 200);
            },
            
            damage: () => {
                Sound.playTone(150, 'sawtooth', 0.3, 0.2);
            }
        };

        const allButtons = document.querySelectorAll('button');
        allButtons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                Sound.hover();
            });
        });

        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        // UI Elements
        const uiScore = document.getElementById('scoreDisplay');
        const uiHighScore = document.getElementById('highScoreDisplay');
        const uiLevel = document.getElementById('levelDisplay');
        const uiHealth = document.getElementById('healthBar');
        const uiFinalScore = document.getElementById('finalScore');
        const powerupInd = document.getElementById('powerupIndicators');
        const leaderboardList = document.getElementById('leaderboardList');

        // Screens
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const leaderboardScreen = document.getElementById('leaderboardScreen');

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Game State & Leaderboard ---
        let isPlaying = false;
        let isPaused = false;
        let animationId;
        let frames = 0;

        let score = 0;
        let level = 1;
        let maxHealth = 100;
        let health = maxHealth;
        let difficultyMultiplier = 1.0;

        // Leaderboard
        let topScores = JSON.parse(localStorage.getItem('neonShooterLeaderboard')) || [0, 0, 0, 0, 0];
        uiHighScore.innerText = topScores[0];

        // Entities
        let stars = [];
        let bullets = [];
        let enemies = []; 
        let particles = [];
        let powerups = [];
        let bgPlanet;

        // --- Input Handling ---
        const keys = { ArrowLeft: false, a: false, ArrowRight: false, d: false, Space: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key) || e.key === ' ' || e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'd') {
                if(e.key === ' ') keys['Space'] = true;
                else keys[e.key] = true;
            }
            if ((e.key === 'Escape' || e.key.toLowerCase() === 'p') && isPlaying) togglePause();
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key) || e.key === ' ' || e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'd') {
                if(e.key === ' ') keys['Space'] = false;
                else keys[e.key] = false;
            }
        });

        const addTouch = (elem, keyMap) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyMap] = true; });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyMap] = false; });
        };
        addTouch(document.getElementById('btnLeft'), 'ArrowLeft');
        addTouch(document.getElementById('btnRight'), 'ArrowRight');
        addTouch(document.getElementById('btnShoot'), 'Space');

        // Difficulty Selector
        const diffButtons = document.querySelectorAll('.diff-btn');
        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficultyMultiplier = parseFloat(e.target.dataset.diff);
            });
        });

        // --- Classes ---

        class Planet {
            constructor() {
                this.activeLevel = 1;
                this.leaving = false;
                this.y = canvas.height * 0.15;
                this.targetY = canvas.height * 0.2;
                this.setTheme(this.activeLevel);
            }

            setTheme(level) {
                const themes = [
                    { c1: '#8B0000', c2: '#FF4500', rings: false, rc: '' },             // Mars/Lava
                    { c1: '#00008B', c2: '#00FFFF', rings: false, rc: '' },             // Neptune/Ice
                    { c1: '#4B0082', c2: '#FF1493', rings: true, rc: 'rgba(255,105,180,0.4)' }, // Neon Pink
                    { c1: '#228B22', c2: '#8B4513', rings: false, rc: '' },             // Toxic Green
                    { c1: '#B8860B', c2: '#FFD700', rings: true, rc: 'rgba(255,215,0,0.3)' },   // Gold/Holy
                    { c1: '#191970', c2: '#4169E1', rings: true, rc: 'rgba(135,206,235,0.4)' }  // Deep Blue
                ];
                let t = themes[(level - 1) % themes.length];
                this.c1 = t.c1;
                this.c2 = t.c2;
                this.rings = t.rings;
                this.rc = t.rc;
                this.radius = 70 + Math.random() * 50;
                this.x = this.radius + 20 + Math.random() * (canvas.width - this.radius*2 - 40);
            }

            triggerLevelUp(newLevel) {
                this.activeLevel = newLevel;
                this.leaving = true;
            }

            update() {
                if (this.leaving) {
                    this.y += 12; // Warp speed slide down
                    if (this.y > canvas.height + this.radius + 50) {
                        this.leaving = false;
                        this.y = -this.radius - 150;
                        this.targetY = canvas.height * (0.1 + Math.random() * 0.15);
                        this.setTheme(this.activeLevel);
                    }
                } else {
                    this.y += (this.targetY - this.y) * 0.03; // Smooth drift in
                    this.targetY += 0.05; // Slow ambient downwards drift
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.PI / 10); 

                // Draw Back Ring
                if (this.rings) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.radius * 2.1, this.radius * 0.35, 0, Math.PI, Math.PI * 2);
                    ctx.strokeStyle = this.rc;
                    ctx.lineWidth = 14;
                    ctx.stroke();
                }

                // Planet Body
                let grad = ctx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, this.radius*0.1, 0, 0, this.radius);
                grad.addColorStop(0, this.c2);
                grad.addColorStop(1, this.c1);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                
                // Atmosphere Glow
                ctx.shadowBlur = 40;
                ctx.shadowColor = this.c2;
                ctx.strokeStyle = `rgba(255,255,255,0.1)`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw Front Ring
                if (this.rings) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.radius * 2.1, this.radius * 0.35, 0, 0, Math.PI);
                    ctx.strokeStyle = this.rc;
                    ctx.lineWidth = 14;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 60; 
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - this.height - 80;
                this.speed = 6.5;
                this.lastShot = 0;
                this.weaponLevel = 0; 
                this.hasShield = false;
            }

            draw() {
                ctx.save();
                
                if (this.hasShield) {
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.height, 0, Math.PI * 2);
                    let grad = ctx.createRadialGradient(this.x+this.width/2, this.y+this.height/2, this.height*0.5, this.x+this.width/2, this.y+this.height/2, this.height);
                    grad.addColorStop(0, 'rgba(0, 255, 255, 0)');
                    grad.addColorStop(1, 'rgba(0, 255, 255, 0.3)');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = '#0ff';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#0ff';
                    ctx.stroke();
                }

                let flameHeight = 15 + Math.random() * 20;
                ctx.fillStyle = '#ffaa00';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y + this.height);
                ctx.lineTo(this.x + this.width/2, this.y + this.height + flameHeight);
                ctx.lineTo(this.x + this.width - 10, this.y + this.height);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.width, this.y);
                grad.addColorStop(0, '#444');
                grad.addColorStop(0.3, '#ddd');
                grad.addColorStop(0.7, '#ddd');
                grad.addColorStop(1, '#222');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width/2, this.y); 
                ctx.quadraticCurveTo(this.x + this.width, this.y + 20, this.x + this.width - 5, this.y + this.height);
                ctx.lineTo(this.x + 5, this.y + this.height);
                ctx.quadraticCurveTo(this.x, this.y + 20, this.x + this.width/2, this.y);
                ctx.fill();

                ctx.fillStyle = '#ff003c';
                ctx.beginPath();
                ctx.moveTo(this.x + 5, this.y + this.height - 25);
                ctx.lineTo(this.x - 12, this.y + this.height + 5);
                ctx.lineTo(this.x + 8, this.y + this.height);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(this.x + this.width - 5, this.y + this.height - 25);
                ctx.lineTo(this.x + this.width + 12, this.y + this.height + 5);
                ctx.lineTo(this.x + this.width - 8, this.y + this.height);
                ctx.fill();

                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.ellipse(this.x + this.width/2, this.y + 25, 4, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                if ((keys.ArrowLeft || keys.a) && this.x > 0) this.x -= this.speed;
                if ((keys.ArrowRight || keys.d) && this.x + this.width < canvas.width) this.x += this.speed;

                let cooldown = this.weaponLevel === 4 ? 22 : 15;

                if (keys.Space && frames - this.lastShot > cooldown) {
                    let cx = this.x + this.width / 2;
                    let tipY = this.y;
                    
                    if (this.weaponLevel === 0) {
                        bullets.push(new Bullet(cx, tipY, 0, -12, '#0ff', 1, false));
                    } else if (this.weaponLevel === 1) {
                        bullets.push(new Bullet(cx - 10, tipY + 10, 0, -14, '#0f0', 1, false));
                        bullets.push(new Bullet(cx + 10, tipY + 10, 0, -14, '#0f0', 1, false));
                    } else if (this.weaponLevel === 2) {
                        bullets.push(new Bullet(cx, tipY, 0, -14, '#f0f', 1, false)); 
                        bullets.push(new Bullet(cx - 8, tipY, -3, -13, '#f0f', 1, false)); 
                        bullets.push(new Bullet(cx + 8, tipY, 3, -13, '#f0f', 1, false)); 
                    } else if (this.weaponLevel === 3) {
                        bullets.push(new Bullet(cx - 15, tipY + 15, 0, -15, '#ff0', 1.2, false));
                        bullets.push(new Bullet(cx - 5, tipY + 5, 0, -15, '#ff0', 1.2, false));
                        bullets.push(new Bullet(cx + 5, tipY + 5, 0, -15, '#ff0', 1.2, false));
                        bullets.push(new Bullet(cx + 15, tipY + 15, 0, -15, '#ff0', 1.2, false));
                    } else {
                        bullets.push(new Bullet(cx, tipY - 10, 0, -10, '#ff4400', 3.5, true));
                    }
                    Sound.shoot();
                    this.lastShot = frames;
                }
                updatePowerupUI();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, color, sizeMult, piercing) {
                this.width = 4 * sizeMult;
                this.height = 15 * sizeMult;
                this.x = x - this.width/2;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.piercing = piercing;
                this.hitEnemies = new Set();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                if (this.piercing) {
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width*0.5, 0, Math.PI*2);
                    ctx.fill();
                } else {
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
                ctx.shadowBlur = 0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        class Enemy {
            constructor() {
                this.width = Math.random() * 25 + 35;
                this.height = this.width;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                
                let rand = Math.random();
                
                if (rand < 0.2 + (level*0.02)) {
                    this.hp = Math.ceil(1 * difficultyMultiplier);
                    this.speed = (4.5 + Math.random() * 2 + (level * 0.5)) * difficultyMultiplier;
                    this.color = '#f0f'; 
                    this.score = 20;
                    this.width *= 0.7;
                    this.height *= 0.7;
                } else if (rand > 0.85 - (level*0.02)) {
                    this.hp = Math.ceil((4 + Math.floor(level/2)) * difficultyMultiplier);
                    this.speed = (1.5 + Math.random() + (level * 0.2)) * difficultyMultiplier;
                    this.color = '#f90'; 
                    this.width *= 1.8;
                    this.height *= 1.8;
                    this.score = 50;
                } else {
                    this.hp = Math.ceil((2 + Math.floor(level/4)) * difficultyMultiplier);
                    this.speed = (2.5 + Math.random() * 2 + (level * 0.3)) * difficultyMultiplier;
                    this.color = '#f00'; 
                    this.score = 10;
                }

                this.vertices = [];
                let numPoints = Math.floor(Math.random() * 4) + 7; 
                for (let i = 0; i < numPoints; i++) {
                    let angle = (i / numPoints) * Math.PI * 2;
                    let radius = (this.width / 2) * (0.75 + Math.random() * 0.3); 
                    this.vertices.push({x: Math.cos(angle) * radius, y: Math.sin(angle) * radius});
                }
                
                this.craters = [];
                let numCraters = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<numCraters; i++){
                    this.craters.push({
                        x: (Math.random() - 0.5) * (this.width*0.5),
                        y: (Math.random() - 0.5) * (this.width*0.5),
                        r: Math.random() * (this.width*0.15) + 2
                    });
                }

                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.08; 
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for(let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();

                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.width/1.2);
                grad.addColorStop(0, '#333');
                grad.addColorStop(0.8, '#111');
                grad.addColorStop(1, '#050505');
                ctx.fillStyle = grad; 
                ctx.fill();

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.stroke();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                this.craters.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
                    ctx.fill();
                    ctx.stroke();
                });

                ctx.restore();
            }
            
            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
                
                if (Math.random() < 0.1) {
                    particles.push(new Particle(this.x + this.width/2, this.y + this.height/2, this.color, true));
                }
            }
        }

        class Particle {
            constructor(x, y, color, isEmber = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isEmber = isEmber;
                
                if (isEmber) {
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 2;
                    this.speedY = -Math.random() * 3; 
                    this.life = 0.8;
                    this.decay = Math.random() * 0.05 + 0.02;
                } else {
                    this.size = Math.random() * 4 + 1;
                    this.speedX = (Math.random() - 0.5) * 10;
                    this.speedY = (Math.random() - 0.5) * 10;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.04 + 0.01;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.isEmber ? 5 : 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }
        }

        class PowerUp {
            constructor() {
                this.width = 24;
                this.height = 24;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = 2.5;
                
                const types = [
                    { id: 'weapon', color: '#0f0', label: 'W' },
                    { id: 'shield', color: '#0ff', label: 'S' },
                    { id: 'health', color: '#ff003c', label: 'H' }
                ];
                this.typeInfo = types[Math.floor(Math.random() * types.length)];
                this.pulse = 0;
            }
            draw() {
                ctx.save();
                this.pulse += 0.1;
                let glow = 15 + Math.sin(this.pulse) * 10;
                
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.strokeStyle = this.typeInfo.color;
                ctx.lineWidth = 2;
                ctx.shadowBlur = glow;
                ctx.shadowColor = this.typeInfo.color;
                
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let angle = (i * Math.PI) / 3;
                    let hx = this.x + this.width/2 + Math.cos(angle) * (this.width/2);
                    let hy = this.y + this.height/2 + Math.sin(angle) * (this.height/2);
                    if(i===0) ctx.moveTo(hx, hy);
                    else ctx.lineTo(hx, hy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = this.typeInfo.color;
                ctx.shadowBlur = 0;
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.typeInfo.label, this.x + this.width/2, this.y + this.height/2 + 1);
                ctx.restore();
            }
            update() {
                this.y += this.speed;
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 3 + 0.5;
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fillRect(this.x, this.y, this.size, (this.size * this.speed * 1.5)); 
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        // --- Helper Functions ---
        function AABBCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function createExplosion(x, y, color) {
            Sound.rockBreak(); 
            let count = Math.floor(Math.random() * 10) + 20;
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
        }

        function updateHUD() {
            uiScore.innerText = score;
            uiLevel.innerText = level;
            let healthPercent = (health / maxHealth) * 100;
            uiHealth.style.width = Math.max(0, healthPercent) + '%';
            
            if(healthPercent > 60) uiHealth.style.background = 'linear-gradient(90deg, #ff003c, #ff6a00)';
            else if(healthPercent > 25) uiHealth.style.background = 'linear-gradient(90deg, #ff0000, #ff003c)';
            else uiHealth.style.background = '#aa0000';
        }

        function updatePowerupUI() {
            let html = '';
            const wpnNames = ["Std. Laser", "Dual Blaster", "Tri-Spread", "Quad Cannon", "Plasma Core"];
            let colors = ['#0ff', '#0f0', '#f0f', '#ff0', '#ff4400'];
            
            html += `<div class="powerup-text" style="color:${colors[player.weaponLevel]}">${wpnNames[player.weaponLevel]}</div>`;
                
            if (player.hasShield) {
                html += `<div class="powerup-text" style="color:#0ff">Deflector Shield</div>`;
            }
            
            powerupInd.innerHTML = html;
        }

        // --- Core Game Functions ---
        let player;

        function initGame() {
            resizeCanvas();
            stars = [];
            for(let i=0; i<100; i++) stars.push(new Star());
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            
            player = new Player();
            bgPlanet = new Planet(); // Initialize Planet!
            
            score = 0;
            level = 1;
            health = maxHealth;
            frames = 0;
            
            updateHUD();
            updatePowerupUI();
        }

        function gameLoop() {
            if (!isPlaying || isPaused) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw distant stars (parallax effect)
            stars.forEach(star => {
                if(star.speed < 2.0) { star.draw(); star.update(); }
            });
            
            // 2. Draw majestic planet between star layers
            if(bgPlanet) {
                bgPlanet.draw();
                bgPlanet.update();
            }

            // 3. Draw foreground stars
            stars.forEach(star => {
                if(star.speed >= 2.0) { star.draw(); star.update(); }
            });

            let spawnRate = Math.max(15, Math.floor((90 - level * 4) / difficultyMultiplier)); 
            if (frames % spawnRate === 0) enemies.push(new Enemy());
            
            if (frames % 700 === 0 && frames > 0) powerups.push(new PowerUp());

            // Check for Level Up!
            if (score > level * 600) {
                level++;
                bgPlanet.triggerLevelUp(level);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.draw();
                p.update();
                
                if (AABBCollision(player, p)) {
                    Sound.powerup();
                    if (p.typeInfo.id === 'weapon') {
                        if(player.weaponLevel < 4) player.weaponLevel++; 
                    } else if(p.typeInfo.id === 'shield') {
                        player.hasShield = true;
                    } else if (p.typeInfo.id === 'health') {
                        health = Math.min(maxHealth, health + 40); 
                    }
                    powerups.splice(i, 1);
                    continue;
                }
                if (p.y > canvas.height) powerups.splice(i, 1);
            }

            player.draw();
            player.update();

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.draw();
                b.update();
                if (b.y < -b.height || b.x < -10 || b.x > canvas.width + 10) bullets.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.draw();
                e.update();

                if (e.y > canvas.height) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Meteor hits Player
                if (AABBCollision(e, player)) {
                    createExplosion(e.x + e.width/2, e.y + e.height/2, e.color);
                    enemies.splice(i, 1);
                    
                    if (player.hasShield) {
                        player.hasShield = false; 
                    } else {
                        health -= 25 * difficultyMultiplier;
                        if (player.weaponLevel > 0) player.weaponLevel--; 
                        Sound.damage();
                        if (health <= 0) gameOver();
                    }
                    continue;
                }

                // Bullet hits Meteor
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (AABBCollision(b, e)) {
                        if (b.piercing) {
                            if (!b.hitEnemies.has(e)) {
                                b.hitEnemies.add(e);
                                e.hp -= 4; 
                                particles.push(new Particle(b.x, b.y, '#fff', true));
                            }
                        } else {
                            bullets.splice(j, 1);
                            e.hp--;
                            particles.push(new Particle(b.x, b.y, b.color, true)); 
                        }
                        
                        if(e.hp <= 0) {
                            createExplosion(e.x + e.width/2, e.y + e.height/2, e.color);
                            enemies.splice(i, 1);
                            score += Math.floor(e.score * difficultyMultiplier);
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.draw();
                p.update();
                if (p.life <= 0) particles.splice(i, 1);
            }

            updateHUD();
            frames++;
            animationId = requestAnimationFrame(gameLoop);
        }

        // --- Data & Menus ---
        function saveHighScore() {
            if (score > 0) {
                topScores.push(score);
                topScores.sort((a, b) => b - a);
                topScores = topScores.slice(0, 5); // Keep top 5
                localStorage.setItem('neonShooterLeaderboard', JSON.stringify(topScores));
                uiHighScore.innerText = topScores[0];
            }
        }

        function renderLeaderboard() {
            leaderboardList.innerHTML = '';
            topScores.forEach((s, index) => {
                let li = document.createElement('li');
                li.innerHTML = `<span>Rank ${index + 1}</span> <strong>${s}</strong>`;
                leaderboardList.appendChild(li);
            });
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            saveHighScore();
            uiFinalScore.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseScreen.classList.remove('hidden');
            } else {
                pauseScreen.classList.add('hidden');
                requestAnimationFrame(gameLoop);
            }
        }

        // --- Event Listeners ---
        document.getElementById('startBtn').addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startScreen.classList.add('hidden');
            initGame();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if(isPlaying) togglePause();
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
            togglePause();
        });

        document.getElementById('homeBtn').addEventListener('click', () => {
            isPaused = false;
            isPlaying = false;
            cancelAnimationFrame(animationId);
            saveHighScore(); 
            pauseScreen.classList.add('hidden');
            startScreen.classList.remove('hidden'); 
        });

        document.getElementById('openLeaderboardBtn').addEventListener('click', () => {
            renderLeaderboard();
            startScreen.classList.add('hidden');
            leaderboardScreen.classList.remove('hidden');
        });

        document.getElementById('closeLeaderboardBtn').addEventListener('click', () => {
            leaderboardScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

    </script>
</body>
